name: Propose Core compatibility

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: core-compatibility-proposal
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Propose an exact immutable Core update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/propose-core-update.py --apply
